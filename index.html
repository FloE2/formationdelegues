<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Formation des délégués de classe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F7F9FF; --sheet:#FFFFFF; --line:#E6ECF9; --line-strong:#CBD7F1; --margin:#E2483D;
  --ink:#1B2A6B; --ink-soft:#4C5A8F; --muted:#6F7BA8; --card:#FFFFFF; --edge:#D3DCF2;
  --ok:#14804A; --ok-bg:#E1F4E8; --bad:#C3342A; --bad-bg:#FCE5E2; --mid:#B5700A; --mid-bg:#FFF0D2;
  --yellow:#FFE45C; --pink:#FF9DCA; --green:#8BE6B0; --blue:#94CEFF; --chip-ink:#17224F;
  --btn:#1B2A6B; --btn-ink:#FFFFFF; --shadow:0 2px 0 rgba(27,42,107,.12);
  --f-body:"Atkinson Hyperlegible","Segoe UI",Arial,sans-serif;
  --f-disp:"Bricolage Grotesque","Arial Black","Segoe UI",sans-serif;
  --f-hand:"Caveat","Segoe Print","Comic Sans MS",cursive;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#16211D; --sheet:#1C2924; --line:rgba(255,255,255,.04); --line-strong:rgba(255,255,255,.08); --margin:#F07A6E;
    --ink:#F1EFE4; --ink-soft:#C9CDBF; --muted:#9AA394; --card:#24332D; --edge:#36483F;
    --ok:#6FD99C; --ok-bg:#1E3D2C; --bad:#FF8A7E; --bad-bg:#45231F; --mid:#F5BC5A; --mid-bg:#43351A;
    --btn:#F1EFE4; --btn-ink:#16211D; --shadow:0 2px 0 rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --paper:#16211D; --sheet:#1C2924; --line:rgba(255,255,255,.04); --line-strong:rgba(255,255,255,.08); --margin:#F07A6E;
  --ink:#F1EFE4; --ink-soft:#C9CDBF; --muted:#9AA394; --card:#24332D; --edge:#36483F;
  --ok:#6FD99C; --ok-bg:#1E3D2C; --bad:#FF8A7E; --bad-bg:#45231F; --mid:#F5BC5A; --mid-bg:#43351A;
  --btn:#F1EFE4; --btn-ink:#16211D; --shadow:0 2px 0 rgba(0,0,0,.35);
}
*,*::before,*::after{box-sizing:inherit}
html{font-size:clamp(15px, .55vw + 10px, 23px); height:100%; scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0; height:100%; display:grid; grid-template-rows:auto 1fr auto; font-family:var(--f-body); color:var(--ink); background:var(--paper)}
button,input{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--margin); outline-offset:2px}

/* Barre du haut */
#top{display:flex; align-items:center; gap:1rem; padding:.5rem 1rem; background:var(--sheet); border-bottom:2px solid var(--line-strong); flex-wrap:wrap}
.brand{font-family:var(--f-disp); font-weight:800; font-size:1.05rem; line-height:1.1}
.brand small{display:block; font-family:var(--f-body); font-weight:400; font-size:.75rem; color:var(--muted)}
.lvl{font-family:var(--f-hand); font-size:1.4rem; color:var(--margin); margin-left:.25rem}
#scores{margin-left:auto; display:flex; gap:.5rem; flex-wrap:wrap}
.team{display:flex; align-items:center; gap:.35rem; padding:.25rem .35rem .25rem .7rem; border-radius:999px; color:var(--chip-ink); font-weight:700; transition:transform .2s}
.team .ts{font-family:var(--f-disp); font-size:1.35rem; min-width:1.6ch; text-align:center}
.team button{width:1.7rem; height:1.7rem; border-radius:50%; border:0; background:rgba(255,255,255,.65); color:var(--chip-ink); font-weight:700; line-height:1}
.team.flash{transform:scale(1.15)}
.c-yellow{background:var(--yellow)} .c-pink{background:var(--pink)} .c-green{background:var(--green)} .c-blue{background:var(--blue)}

/* Feuille Séyès */
#stage{overflow:auto; background:
  linear-gradient(var(--line-strong) 1.5px, transparent 1.5px) 0 0/100% 2rem,
  linear-gradient(var(--line) 1px, transparent 1px) 0 0/100% .5rem,
  linear-gradient(90deg, var(--line-strong) 1px, transparent 1px) 0 0/2rem 100%, var(--paper)}
.sheet{position:relative; max-width:1320px; margin:0 auto; min-height:100%; padding:1.5rem 1.5rem 2.5rem 5.5rem}
.sheet::before{content:""; position:absolute; left:4.25rem; top:0; bottom:0; width:2px; background:var(--margin)}
.mnum{position:absolute; left:.6rem; top:1rem; width:3.2rem; text-align:center; font-family:var(--f-hand); font-weight:700; font-size:3rem; color:var(--margin); line-height:1}
.bh{display:flex; justify-content:space-between; align-items:flex-start; gap:1rem; flex-wrap:wrap; margin-bottom:1.25rem}
.bh h1{font-family:var(--f-disp); font-weight:800; font-size:2.4rem; line-height:1.05; margin:0 0 .3rem}
.bh .lead{margin:0; font-size:1.05rem; color:var(--ink-soft); max-width:60ch}
.meta{display:flex; flex-direction:column; align-items:flex-end; gap:.3rem; font-size:.85rem; color:var(--muted)}
.liv{background:var(--card); border:1px solid var(--edge); border-radius:6px; padding:.2rem .5rem}

/* Éléments communs */
.btn{border:0; border-radius:10px; padding:.6rem 1.1rem; background:var(--btn); color:var(--btn-ink); font-weight:700; box-shadow:var(--shadow)}
.btn:disabled{opacity:.4; cursor:not-allowed}
.btn.ghost{background:var(--card); color:var(--ink); border:2px solid var(--edge)}
.btn.big{font-size:1.2rem; padding:.85rem 1.5rem}
.row{display:flex; gap:.75rem; align-items:center; flex-wrap:wrap}
.row.end{justify-content:flex-end}
.row.center{justify-content:center}
.card{background:var(--card); border:2px solid var(--edge); border-radius:14px; padding:1.1rem 1.3rem}
.hand{font-family:var(--f-hand); font-weight:700; font-size:1.7rem; line-height:1.15; color:var(--ok)}
.hand.bad{color:var(--bad)} .hand.mid{color:var(--mid)} .hand.ink{color:var(--ink)}
.counter{font-size:.9rem; color:var(--muted)}
.big-text{font-family:var(--f-disp); font-weight:600; font-size:2rem; line-height:1.2}
.award{display:flex; align-items:center; gap:.5rem; flex-wrap:wrap; margin-top:1rem; font-size:.9rem; color:var(--muted)}
.chip-btn{border:0; border-radius:999px; padding:.35rem .9rem; font-weight:700; color:var(--chip-ink)}
.chip-btn.given{opacity:.35; text-decoration:line-through}
.spacer{height:1rem}
.grid2{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,20rem),1fr)); gap:1rem}

/* Bas de page */
#bottom{display:flex; align-items:center; gap:.75rem; padding:.5rem 1rem; background:var(--sheet); border-top:2px solid var(--line-strong)}
#bottom .mid{flex:1; display:flex; justify-content:center; gap:1rem; align-items:center; flex-wrap:wrap}
#stepBtn{background:none; border:2px dashed var(--edge); border-radius:10px; padding:.4rem .9rem}
#timer{display:flex; align-items:center; gap:.3rem; padding:.2rem .4rem .2rem .8rem; border-radius:10px; background:var(--card); border:2px solid var(--edge)}
#tmTime{font-family:var(--f-disp); font-weight:800; font-size:1.5rem; min-width:4ch; text-align:center; font-variant-numeric:tabular-nums}
#timer button{border:0; background:none; font-size:1.1rem; width:2rem; height:2rem; border-radius:8px}
#timer button:hover{background:var(--paper)}
#timer.ending{border-color:var(--mid); color:var(--mid)}
#timer.over{border-color:var(--bad); background:var(--bad-bg); color:var(--bad); animation:pulse 1s 3}
@keyframes pulse{50%{transform:scale(1.08)}}

/* Sommaire */
#drawer{position:fixed; inset:0; background:rgba(10,15,40,.45); display:flex; justify-content:flex-start; z-index:10}
#drawer[hidden]{display:none}
#drawer .panel{background:var(--sheet); width:min(26rem,92vw); height:100%; overflow:auto; padding:calc(1rem + env(safe-area-inset-top,0px)) 1rem calc(1rem + env(safe-area-inset-bottom,0px))}
#drawer h2{font-family:var(--f-disp); margin:.2rem 0 .8rem}
#drawer ol{list-style:none; padding:0; margin:0}
#drawer li button{width:100%; display:flex; gap:.6rem; align-items:baseline; text-align:left; background:none; border:0; border-bottom:1px solid var(--line-strong); padding:.55rem .3rem}
#drawer li button .n{font-family:var(--f-hand); font-size:1.5rem; color:var(--margin); width:1.8rem}
#drawer li button .d{margin-left:auto; color:var(--muted); font-size:.85rem}
#drawer li.cur button{background:var(--paper); font-weight:700}

.copy{font-size:.8rem; color:var(--muted); margin-top:1rem}
/* Accueil */
.home{max-width:1100px; margin:0 auto; padding:2.5rem 1.5rem}
.home h1{font-family:var(--f-disp); font-weight:800; font-size:clamp(2.6rem,6vw,5rem); line-height:.95; margin:0}
.home .sub{font-family:var(--f-hand); font-size:2rem; color:var(--margin); margin:.4rem 0 2rem}
.lvl-pick{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,16rem),1fr)); gap:1rem; margin:1rem 0 2rem}
.lvl-pick button{border:3px solid var(--edge); background:var(--card); border-radius:16px; padding:1.2rem; text-align:left}
.lvl-pick button b{display:block; font-family:var(--f-disp); font-size:2.6rem}
.lvl-pick button.on{border-color:var(--ink); box-shadow:inset 0 0 0 2px var(--ink)}
.teams-edit{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,13rem),1fr)); gap:.75rem; margin:.75rem 0 2rem}
.teams-edit label{display:flex; align-items:center; gap:.5rem; border-radius:12px; padding:.4rem .6rem; color:var(--chip-ink); font-weight:700}
.teams-edit input{flex:1; min-width:0; border:0; border-radius:8px; padding:.4rem .5rem; background:rgba(255,255,255,.8); color:var(--chip-ink)}
.howto{color:var(--ink-soft); max-width:65ch}

/* Cadre */
.rules{list-style:none; padding:0; margin:0 0 1.5rem; display:grid; gap:.8rem}
.rules li{display:flex; gap:1rem; align-items:center; font-family:var(--f-disp); font-weight:600; font-size:1.7rem}
.rules li span{font-family:var(--f-hand); color:var(--ok); font-size:2.4rem}
.menu-list{columns:2 16rem; padding-left:1.4rem; margin:.5rem 0 0}
.menu-list li{margin:.2rem 0; break-inside:avoid}

/* Nuage */
.cloud-form{display:flex; gap:.6rem; margin-bottom:1rem; flex-wrap:wrap}
.cloud-form input{flex:1; min-width:12rem; font-size:1.3rem; padding:.6rem .9rem; border:2px solid var(--edge); border-radius:10px; background:var(--card)}
.cloud{min-height:16rem; display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:.4rem 1.2rem; padding:1.5rem; background:var(--card); border:2px solid var(--edge); border-radius:16px}
.cloud .w{position:relative; font-family:var(--f-disp); font-weight:800; line-height:1; background:none; border:0; padding:.1rem .2rem; transition:font-size .25s}
.cloud .w .x{position:absolute; top:-.6rem; right:-.8rem; font-size:.8rem; width:1.3rem; height:1.3rem; border-radius:50%; background:var(--bad); color:#fff; display:none; align-items:center; justify-content:center; font-family:var(--f-body)}
.cloud .w:hover .x{display:flex}
.cloud-empty{color:var(--muted); font-family:var(--f-hand); font-size:1.8rem}
.quote{font-family:var(--f-hand); font-size:2.1rem; color:var(--ink); text-align:center; margin:1.5rem auto 0; max-width:40ch}

/* Tri */
.tri-card{max-width:46rem; margin:0 auto 1.25rem; text-align:center; padding:2rem 1.5rem; background:var(--card); border:3px solid var(--ink); border-radius:18px; box-shadow:6px 6px 0 var(--line-strong)}
.cols{display:grid; grid-template-columns:repeat(3,1fr); gap:.8rem}
.col{border:3px dashed var(--edge); border-radius:14px; padding:.8rem; min-height:7rem; background:var(--card); display:flex; flex-direction:column; gap:.4rem}
.col h3{margin:0; font-family:var(--f-disp); font-size:1.3rem; display:flex; justify-content:space-between}
.col.ok{border-color:var(--ok)} .col.no{border-color:var(--bad)} .col.talk{border-color:var(--mid)}
button.col{text-align:left}
button.col:hover:not(:disabled){background:var(--paper)}
.col .mini{font-size:.8rem; padding:.25rem .45rem; border-radius:6px; background:var(--paper)}
.col .mini.wrong{background:var(--bad-bg)}
.fb{margin-top:1rem; padding:1rem 1.2rem; border-radius:12px; background:var(--card); border-left:6px solid var(--ok)}
.fb.bad{border-left-color:var(--bad)} .fb.mid{border-left-color:var(--mid)}
.fb p{margin:.3rem 0 0; font-size:1.1rem}

/* Débat */
.deb{display:grid; grid-template-columns:1fr 2.2fr 1fr; gap:1rem; align-items:stretch}
.zone{border-radius:16px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:.5rem; padding:1rem; font-family:var(--f-disp); font-weight:800; font-size:1.5rem; text-align:center}
.zone.no{background:var(--bad-bg); color:var(--bad)} .zone.yes{background:var(--ok-bg); color:var(--ok)}
.zone .cnt{display:flex; align-items:center; gap:.4rem; font-size:2rem}
.zone .cnt button{width:2rem; height:2rem; border-radius:50%; border:0; background:var(--card); color:inherit; font-weight:800}
.deb-st{background:var(--card); border:3px solid var(--ink); border-radius:18px; padding:1.5rem; display:flex; flex-direction:column; justify-content:center; text-align:center; min-height:14rem}
details.rules-box{margin-top:1rem; background:var(--card); border:2px solid var(--edge); border-radius:12px; padding:.6rem 1rem}
details.rules-box summary{font-weight:700; cursor:pointer}
details.rules-box ul{margin:.5rem 0 0}

/* Casquettes */
.caps{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,15rem),1fr)); gap:1.4rem; margin-top:.5rem}
.cap{position:relative; border:0; text-align:left; padding:1.6rem 1.2rem 1.2rem; min-height:14rem; border-radius:4px; color:var(--chip-ink); box-shadow:3px 4px 0 rgba(0,0,0,.12); display:flex; flex-direction:column; gap:.6rem}
.cap:nth-child(odd){transform:rotate(-1.2deg)} .cap:nth-child(even){transform:rotate(1deg)}
.cap::before{content:""; position:absolute; top:-.7rem; left:50%; width:5rem; height:1.4rem; transform:translateX(-50%) rotate(-3deg); background:rgba(255,255,255,.55); border:1px solid rgba(0,0,0,.06)}
.cap .em{font-size:2.4rem}
.cap .def{font-size:1.1rem}
.cap .nm{margin-top:auto; font-family:var(--f-hand); font-size:2.3rem; font-weight:700}
.cap .nm.hid{color:rgba(23,34,79,.35)}

/* Choix (qui, instance, quiz, dis) */
.situ{font-family:var(--f-disp); font-weight:600; font-size:1.9rem; line-height:1.2; background:var(--card); border:3px solid var(--ink); border-radius:18px; padding:1.4rem 1.6rem; margin-bottom:1.2rem}
.opts{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,13rem),1fr)); gap:.7rem}
.opt{border:2px solid var(--edge); background:var(--card); border-radius:12px; padding:.8rem 1rem; text-align:left; font-size:1.05rem; display:flex; gap:.6rem; align-items:center; min-height:3.4rem}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt .em{font-size:1.6rem}
.opt.right{background:var(--ok-bg); border-color:var(--ok); color:var(--ok); font-weight:700}
.opt.wrong{background:var(--bad-bg); border-color:var(--bad); color:var(--bad); text-decoration:line-through}
.opt:disabled{cursor:default}
.opt .lt{font-family:var(--f-disp); font-weight:800; font-size:1.3rem; width:2rem; height:2rem; display:inline-flex; align-items:center; justify-content:center; border-radius:8px; background:var(--paper); flex:none}
.opts.long{grid-template-columns:1fr}
.opts.long .opt{font-size:1.25rem}
.opt-fb{display:block; font-family:var(--f-hand); font-size:1.45rem; margin-top:.25rem; text-decoration:none}

/* Instance */
.clues{list-style:none; padding:0; margin:0 0 1rem; display:grid; gap:.5rem}
.clues li{display:flex; gap:.8rem; align-items:center; background:var(--card); border:2px solid var(--edge); border-radius:12px; padding:.7rem 1rem; font-size:1.35rem}
.clues li .n{font-family:var(--f-hand); font-size:2rem; color:var(--margin); width:1.5rem}
.clues li.hidden{color:var(--muted); border-style:dashed; font-style:italic; font-size:1rem}
.pts{font-family:var(--f-disp); font-weight:800; font-size:1.3rem}
.fiche{display:grid; grid-template-columns:auto 1fr; gap:.3rem 1rem; margin-top:.6rem; font-size:1.05rem}
.fiche b{color:var(--margin)}

/* Conseil */
.tabs{display:flex; gap:.4rem; margin-bottom:1rem; flex-wrap:wrap}
.tabs button{border:2px solid var(--edge); background:var(--card); border-radius:10px 10px 0 0; padding:.5rem 1rem; font-weight:700}
.tabs button.on{background:var(--ink); color:var(--btn-ink); border-color:var(--ink)}
:root[data-theme="dark"] .tabs button.on{color:var(--paper)}
.table-wrap{display:grid; grid-template-columns:minmax(0,1.2fr) minmax(0,1fr); gap:1.5rem; align-items:center}
.rtable{position:relative; width:100%; max-width:34rem; aspect-ratio:1; margin:0 auto}
.rtable .tbl{position:absolute; inset:24%; border-radius:50%; background:var(--card); border:3px solid var(--ink); display:flex; align-items:center; justify-content:center; text-align:center; font-family:var(--f-hand); font-size:1.6rem; padding:1rem}
.seat{position:absolute; transform:translate(-50%,-50%); border:2px solid var(--edge); background:var(--card); border-radius:999px; padding:.35rem .7rem; font-size:.85rem; font-weight:700; white-space:nowrap}
.seat.me{background:var(--yellow); color:var(--chip-ink); border-color:var(--chip-ink)}
.seat.on{outline:3px solid var(--margin)}
.list-big{font-size:1.2rem; padding-left:1.3rem} .list-big li{margin:.45rem 0}
.sticky{background:var(--yellow); color:var(--chip-ink); padding:1rem 1.2rem; border-radius:4px; transform:rotate(-1deg); box-shadow:3px 4px 0 rgba(0,0,0,.12)}
.sticky h3{margin:0 0 .3rem; font-family:var(--f-hand); font-size:2rem}

/* Ordre */
.order{list-style:none; padding:0; margin:0; display:grid; gap:.45rem; max-width:52rem}
.order li{display:flex; align-items:center; gap:.7rem; background:var(--card); border:2px solid var(--edge); border-radius:12px; padding:.55rem .7rem; font-size:1.2rem; cursor:grab; user-select:none}
.order li.dragging{opacity:.4}
.order li.over{border-color:var(--ink); border-style:dashed}
.order li .pos{font-family:var(--f-hand); font-size:1.8rem; color:var(--margin); width:1.8rem; text-align:center}
.order li .t{flex:1}
.order li .arr{display:flex; flex-direction:column}
.order li .arr button{border:0; background:var(--paper); border-radius:6px; width:2rem; height:1.4rem; font-size:.75rem; margin:1px 0}
.order li.ex{border-color:var(--ok); background:var(--ok-bg)}
.order li.ph{border-color:var(--mid); background:var(--mid-bg)}
.order li.ko{border-color:var(--bad); background:var(--bad-bg)}
.tag{font-size:.8rem; font-weight:700; padding:.15rem .5rem; border-radius:999px; background:var(--paper)}
.legend{display:flex; gap:1rem; flex-wrap:wrap; font-size:.9rem; margin:.6rem 0}
.legend span::before{content:""; display:inline-block; width:.9rem; height:.9rem; border-radius:3px; margin-right:.35rem; vertical-align:-2px}
.legend .l1::before{background:var(--ok)} .legend .l2::before{background:var(--mid)} .legend .l3::before{background:var(--bad)}

/* Notes */
.appr{position:relative; background:var(--card); border:3px solid var(--ink); border-radius:16px; padding:1.2rem 1.4rem; margin-bottom:1rem; min-height:7rem}
.appr .txt{font-size:1.45rem; line-height:1.4}
.appr .veil{color:var(--muted); font-family:var(--f-hand); font-size:1.8rem}
.cd{position:absolute; top:.6rem; right:.9rem; font-family:var(--f-disp); font-weight:800; font-size:1.6rem; color:var(--margin)}
.ngrid{display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:.5rem}
.ngrid h4{margin:0 0 .3rem; font-family:var(--f-disp); font-size:1rem; text-align:center}
.ngrid .colx{display:flex; flex-direction:column; gap:.3rem}
.nb{border:2px solid var(--edge); background:var(--card); border-radius:8px; padding:.35rem .4rem; font-size:.85rem; text-align:center; min-height:2.6rem}
.nb.sel{background:var(--ink); color:var(--btn-ink); border-color:var(--ink)}
.nb.right{background:var(--ok-bg); color:var(--ok); border-color:var(--ok); font-weight:700}
.nb.wrong{background:var(--bad-bg); color:var(--bad); border-color:var(--bad); text-decoration:line-through}

/* Lettres */
.word{display:flex; gap:.4rem; justify-content:center; flex-wrap:wrap; margin:1rem 0}
.word span{width:2.6rem; height:3.4rem; border-bottom:4px solid var(--ink); display:flex; align-items:flex-end; justify-content:center; font-family:var(--f-disp); font-weight:800; font-size:2.4rem}
.word span.sp{border:0; width:1rem}
.word span.fixed{border-bottom-color:transparent}
.word span.miss{color:var(--bad)}
.keys{display:flex; flex-wrap:wrap; gap:.35rem; justify-content:center; max-width:44rem; margin:0 auto}
.keys button{width:2.6rem; height:2.6rem; border-radius:8px; border:2px solid var(--edge); background:var(--card); font-weight:700; font-size:1.1rem}
.keys button.hit{background:var(--ok-bg); border-color:var(--ok); color:var(--ok)}
.keys button.no{background:var(--bad-bg); border-color:var(--bad); color:var(--bad); opacity:.6}
.pencils{text-align:center; font-size:1.6rem; letter-spacing:.2rem}
.pencils .used{opacity:.15}

/* Bilan */
.podium{display:flex; align-items:flex-end; justify-content:center; gap:.8rem; height:16rem; margin:1rem 0 1.5rem}
.pod{width:min(9rem,22%); border-radius:12px 12px 0 0; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; padding-top:.6rem; color:var(--chip-ink); font-weight:700; text-align:center}
.pod .rk{font-family:var(--f-disp); font-weight:800; font-size:2rem}
.pod .sc{font-family:var(--f-disp); font-size:1.3rem}
.meteo{display:flex; gap:.6rem; flex-wrap:wrap; justify-content:center}
.meteo button{border:2px solid var(--edge); background:var(--card); border-radius:14px; padding:.6rem .8rem; min-width:7rem; display:flex; flex-direction:column; align-items:center; gap:.1rem}
.meteo .e{font-size:2.4rem} .meteo .c{font-family:var(--f-disp); font-weight:800; font-size:1.5rem}
#diploma{margin-top:1.5rem; background:#fff; color:#1B2A6B; border:6px double #1B2A6B; border-radius:6px; padding:2rem; text-align:center; max-width:46rem; margin-left:auto; margin-right:auto}
#diploma h2{font-family:var(--f-disp); font-weight:800; font-size:2.4rem; margin:.2rem 0}
#diploma .h{font-family:"Caveat",cursive; font-size:1.8rem; color:#E2483D}
#diploma .line{border-bottom:2px dotted #1B2A6B; width:70%; margin:1.6rem auto .3rem; height:1.5rem}
#diploma .sig{display:flex; justify-content:space-between; margin-top:2rem; font-size:.9rem}

@media (max-width:760px){
  .sheet{padding-left:3.2rem} .sheet::before{left:2.4rem} .mnum{width:2.2rem; font-size:2rem; left:.1rem}
  .cols{grid-template-columns:1fr} .deb{grid-template-columns:1fr} .table-wrap{grid-template-columns:1fr}
  .ngrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .bh h1{font-size:1.8rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important}}
@media print{
  body{display:block; background:#fff}
  body *{visibility:hidden}
  #diploma, #diploma *{visibility:visible}
  #diploma{position:absolute; left:0; top:0; width:100%; max-width:none; margin:0}
}

function save(){ try{ localStorage.setItem("deleg-form", JSON.stringify({level:state.level, step:state.step, teams:state.teams})); }catch(e){} }
function load(){ try{ const s=JSON.parse(localStorage.getItem("deleg-form")||"null"); if(s&&s.teams&&s.teams.length===4){ state.level=s.level; state.teams=s.teams; return s; } }catch(e){} return null; }

const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const esc = s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle = a=>{a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a;};
const forLv = arr=>arr.filter(x=>!x.lv||x.lv===state.level);
const norm = s=>s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toUpperCase();
const fmt = s=>String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
const lvlName = ()=>state.level==="65"?"6e – 5e":"4e – 3e";

function award(pts, label){
  return `<div class="award"><span>${label||"Points"} <b>+${pts}</b> pour :</span>${state.teams.map((t,i)=>`<button class="chip-btn c-${t.color}" data-award="${i}" data-pts="${pts}">${esc(t.name)}</button>`).join("")}</div>`;
}
function renderScores(flash){
  $("#scores").innerHTML = state.teams.map((t,i)=>`<div class="team c-${t.color}${i===flash?" flash":""}"><span class="tn">${esc(t.name)}</span><span class="ts">${t.score}</span><button data-sc="${i}" data-d="-1" aria-label="Retirer un point">−</button><button data-sc="${i}" data-d="1" aria-label="Ajouter un point">+</button></div>`).join("");

  $("#lvlTag").textContent = state.level&&state.step>=0 ? lvlName() : "";
}
document.addEventListener("click", e=>{
  const sc=e.target.closest("[data-sc]");
  if(sc){ const i=+sc.dataset.sc; state.teams[i].score=Math.max(0,state.teams[i].score+(+sc.dataset.d)); renderScores(i); save(); return; }
  const a=e.target.closest("[data-award]");
  if(a){ const i=+a.dataset.award; state.teams[i].score+=+a.dataset.pts; a.disabled=true; a.classList.add("given"); renderScores(i); save(); }
});

/* ============ CHRONO ============ */
const T={left:0,total:0,run:false,h:null,over:false};
function setTimer(sec,auto){ clearInterval(T.h); T.run=false; T.over=false; T.total=T.left=sec; drawTimer(); if(auto) startTimer(); }
function startTimer(){ if(T.left<=0) T.left=T.total; T.over=false; T.run=true; clearInterval(T.h);
  T.h=setInterval(()=>{ T.left--; if(T.left<=0){ T.left=0; T.run=false; T.over=true; clearInterval(T.h); ding(); } drawTimer(); },1000); drawTimer(); }
function pauseTimer(){ T.run=false; clearInterval(T.h); drawTimer(); }
function drawTimer(){ $("#tmTime").textContent=fmt(T.left); $("#tmPlay").textContent=T.run?"⏸":"▶";
  const el=$("#timer"); el.classList.toggle("ending",T.run&&T.left<=10); el.classList.toggle("over",T.over); }
function ding(){ try{ const c=new (window.AudioContext||window.webkitAudioContext)(); [0,.25,.5].forEach(d=>{ const o=c.createOscillator(), g=c.createGain(); o.frequency.value=880; o.connect(g); g.connect(c.destination); g.gain.setValueAtTime(.2,c.currentTime+d); g.gain.exponentialRampToValueAtTime(.001,c.currentTime+d+.2); o.start(c.currentTime+d); o.stop(c.currentTime+d+.22); }); }catch(e){} }
$("#tmPlay").onclick=()=>T.run?pauseTimer():startTimer();
$("#tmReset").onclick=()=>setTimer(T.total);
$("#tmPlus").onclick=()=>{ T.left+=60; T.total=Math.max(T.total,T.left); T.over=false; drawTimer(); };

/* ============ NAVIGATION ============ */
function head(b){ return `<header class="bh"><div><h1>${b.title}</h1><p class="lead">${b.lead}</p></div><div class="meta"><span>⏱ ${b.dur} min</span>${b.livret?`<span class="liv">📘 Livret : ${b.livret}</span>`:""}</div></header>`; }
function go(i){
  state.step=Math.max(-1,Math.min(BLOCKS.length-1,i)); save();
  const st=$("#stage"); st.scrollTop=0;
  if(state.step<0){ $("#bottom").hidden=true; renderHome(st); setTimer(0); renderScores(); return; }
  $("#bottom").hidden=false;
  const b=BLOCKS[state.step];
  st.innerHTML=`<article class="sheet"><div class="mnum">${state.step+1}</div><div id="sb"></div></article>`;
  b.render($("#sb"));
  setTimer(b.dur*60);
  $("#stepBtn").textContent=`☰ ${state.step+1} / ${BLOCKS.length}  ${b.title}`;
  $("#prevBtn").disabled=false;
  $("#nextBtn").textContent = state.step===BLOCKS.length-1 ? "Accueil" : "Suivant ▶";
  renderScores();
}
function refresh(){ BLOCKS[state.step].render($("#sb")); }
$("#prevBtn").onclick=()=>go(state.step-1);
$("#nextBtn").onclick=()=>go(state.step===BLOCKS.length-1?-1:state.step+1);
$("#stepBtn").onclick=openDrawer;
$("#drawer").onclick=e=>{ if(e.target.id==="drawer") $("#drawer").hidden=true; };
function openDrawer(){
  const tot=BLOCKS.reduce((s,b)=>s+b.dur,0);
  $("#drawerPanel").innerHTML=`<h2>Sommaire</h2><p class="counter">Durée totale : environ ${Math.floor(tot/60)} h ${String(tot%60).padStart(2,"0")}. Passe une étape si le temps manque.</p><ol>${BLOCKS.map((b,i)=>`<li class="${i===state.step?"cur":""}"><button data-go="${i}"><span class="n">${i+1}</span>${b.title}<span class="d">${b.dur} min</span></button></li>`).join("")}<li><button data-go="-1"><span class="n">⌂</span>Retour à l’accueil</button></li></ol><p class="copy">© 2026 Eude Florian. Collège Yves du Manoir.</p>`;
  $$("[data-go]",$("#drawerPanel")).forEach(x=>x.onclick=()=>{ $("#drawer").hidden=true; go(+x.dataset.go); });
  $("#drawer").hidden=false;
}
document.addEventListener("keydown",e=>{
  if(e.target.matches("input,textarea")||state.step<0) return;
  if(e.key==="ArrowRight") $("#nextBtn").click();
  if(e.key==="ArrowLeft") go(state.step-1);
  if(e.key==="Escape") $("#drawer").hidden=true;
});

{id:"ordre", title:"Avant, pendant, après", dur:7, livret:"« Avant », « Pendant », « Après le conseil »", lead:"Remets les étapes du délégué dans l’ordre. Glisse les étiquettes ou utilise les flèches.", render(el){

{id:"qual", title:"Les qualités du délégué", dur:4, lead:"Lis l’indice. Les équipes proposent une lettre chacune leur tour. Six erreurs maximum !", render(el){
  const S=state.b.qua||(state.b.qua={deck:forLv(QUAL), i:0, g:[], reveal:false});

  const q=S.deck[S.i], fixedLen=q.fixed?q.fixed.length:0;

  const needed=[...new Set(letters.filter(l=>l.isL).map(l=>norm(l.ch)))];
  const errors=S.g.filter(x=>!needed.includes(x)).length;
  const won=needed.every(x=>S.g.includes(x)), lost=errors>=6&&!won, end=won||lost||S.reveal;
  el.innerHTML=head(this)+`<p class="counter">Mot ${S.i+1} / ${S.deck.length}</p><div class="situ" style="text-align:center">${esc(q.h)}</div>

    <div class="spacer"></div>

  const rv=$("#rv",el); if(rv) rv.onclick=()=>{ S.reveal=true; refresh(); };

}},
